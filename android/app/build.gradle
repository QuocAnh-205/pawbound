// PAWBOUND Android: biên dịch engine C++ (CMakeLists.txt gốc của repo) thành libmain.so cho SDLActivity.
plugins {
    id 'com.android.application'
}

def repoRoot = file('../..')
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { localProps.load(it) }
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME')
def ndkVer = '28.2.13676358'
def hostTag = System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64'
def glslc = new File(sdkDir, "ndk/${ndkVer}/shader-tools/${hostTag}/glslc" + (hostTag.startsWith('windows') ? '.exe' : '')).absolutePath.replace(File.separator, '/')

android {
    namespace = 'vn.pawbound.game'
    compileSdk = 35
    ndkVersion = ndkVer

    defaultConfig {
        applicationId = 'vn.pawbound.game'
        minSdk = 33          // Android 13+: libvulkan xuất hàm Vulkan 1.3 lõi; thiết bị phải có driver Vulkan 1.3
        targetSdk = 35
        versionCode = 2
        versionName = '0.2.0-test1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DPB_BUILD_SERVER=OFF', '-DPB_BUILD_TESTS=OFF', '-DCMAKE_BUILD_TYPE=Release',
                          // glslc đi kèm NDK: biên dịch shader GLSL -> SPIR-V trên máy build
                          "-DVulkan_GLSLC_EXECUTABLE=${glslc}".toString()
                targets 'pawbound_client'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("${repoRoot}/CMakeLists.txt")
            version = '4.1.2'
            buildStagingDirectory = file("${repoRoot}/build/android-cxx")
        }
    }

    // asset/data/config được android/prepare_assets.py chép vào đây (kèm danh mục pawbound_files.txt)
    sourceSets.main.assets.srcDirs = [file("${repoRoot}/build/android-assets")]

    signingConfigs {
        release {
            // Khóa ký KHÔNG nằm trong repo: đặt đường dẫn/mật khẩu qua biến môi trường
            def ks = System.getenv('PAWBOUND_KEYSTORE')
            if (ks) {
                storeFile = file(ks)
                storePassword = System.getenv('PAWBOUND_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('PAWBOUND_KEY_ALIAS') ?: 'pawbound'
                keyPassword = System.getenv('PAWBOUND_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = System.getenv('PAWBOUND_KEYSTORE') ? signingConfigs.release : null
        }
    }
    lint { abortOnError = false }
}
